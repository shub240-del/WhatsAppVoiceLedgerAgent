name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration + API tests (in-memory Firestore)
        run: pnpm test:memory
      - name: Build
        run: pnpm build
      - name: Browser component tests (assistant, fake microphone, accessibility)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:components
